# CI for tendersearch.
#
# The whole suite is offline by design — fixtures in tests/fixtures/ are real
# CanadaBuys feed data captured once and checked in. So there are no secrets to
# configure, no rate limits to respect, and nothing flaky to babysit. A test
# that reaches the network here is a bug in the test, not a CI problem.
#
# Deliberately NOT here: any live fetch from CanadaBuys. The feed is public open
# data and polite to poll, but a CI job that depends on it turns an unrelated
# outage into a red build, and the fixtures are what actually pin the schema
# contract. Run `canadabuys fetch --feed open` locally when you want to check
# the live feed still matches.
#
# The Linux matrix matters more than it looks: development happens on Windows,
# where a path bug once silently wrote notices into NTFS alternate data streams.
# Running elsewhere is what catches the mirror-image class of bug before someone
# forking on Linux or macOS hits it.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Run the suite
        run: pytest -v

  lint-skills:
    name: Command and skill frontmatter
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint frontmatter
        run: python tools/lint_skills.py

  privacy:
    name: No personal data committed
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # profiles/ and teams/ hold members' resumes and real client names;
      # bids/ holds drafts naming real opportunities and is the one directory
      # that cannot be regenerated; archives/ and outcomes.jsonl carry real
      # procurement history. The .gitignore allowlists only the two example
      # files; this asserts that the allowlist has not been widened and
      # nothing real slipped past it.
      - name: Assert only example profiles are tracked
        run: |
          tracked=$(git ls-files 'profiles/**' 'teams/**' 'bids/**' 'archives/**' 'outcomes.jsonl' || true)
          expected=$'profiles/_example/profile.yml\nteams/_example.yml'
          if [ "$tracked" != "$expected" ]; then
            echo "FAIL - unexpected tracked files under profiles/, teams/, bids/, or archives/:"
            echo "$tracked"
            echo ""
            echo "Expected exactly:"
            echo "$expected"
            exit 1
          fi
          echo "OK - only the committed example profile and team are tracked"
